# ლოკალური სრული სტეკის გასაშვები ფაილი (Postgres + Django backend + React frontend).
# გაშვება:   docker compose up --build
# გაჩერება:  docker compose down
# წაშლა მონაცემებთან ერთად: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orioni
      POSTGRES_USER: orioni
      POSTGRES_PASSWORD: orioni_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orioni"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: local-dev-secret-key-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://orioni:orioni_local_password@db:5432/orioni
      CORS_ALLOW_ALL_ORIGINS: "True"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000/api/
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  postgres_data:
  media_data: