databases:
  - name: orioni-db
    plan: free
    databaseName: orioni
    user: orioni

services:
  # ---------- Django REST backend (Docker) ----------
  - type: web
    name: orioni-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/backend/Dockerfile
    dockerContext: ./backend/backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: orioni-db
          property: connectionString

  # ---------- React frontend (Static Site) ----------
  - type: web
    name: orioni-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend/frontend
    envVars:
      - key: VITE_API_URL
        value: https://orioni-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
