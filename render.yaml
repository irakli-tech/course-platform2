# Render Blueprint — ავტომატურად ქმნის backend-ს (Docker) და frontend-ს (Static Site).
# ბაზა აღარაა Render-ის მართული — გამოიყენება გარე Neon PostgreSQL (იხ. DATABASE_URL ქვემოთ).
# დოკუმენტაცია: https://render.com/docs/blueprint-spec

services:
  # ---------- Django REST backend (Docker) ----------
  - type: web
    name: orioni-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/backend/Dockerfile
    dockerContext: ./backend/backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.onrender\\.com$"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false #  ხელით ჩაწერ Render Dashboard-ში (Neon connection string)

  # ---------- React frontend (Static Site) ----------
  - type: web
    name: orioni-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    rootDir: frontend/frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://orioni-backend.onrender.com/api/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
